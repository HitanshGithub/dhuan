[project]
name = "dhuan"
version = "0.1.0"
description = "Live smoke forecast for North India's stubble-burning season"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "boto3>=1.35",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "shapely>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
